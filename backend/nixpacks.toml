# Railway Nixpacks Configuration
# This tells Railway how to build the backend

[phases.setup]
nixPkgs = ["nodejs-20_x"]

[phases.install]
cmds = ["npm install"]

[phases.build]
cmds = ["npm run db:switch:postgres", "npm run db:generate", "npm run db:migrate:deploy", "npm run build"]

[start]
cmd = "npm start"
