<!DOCTYPE html>
<html>

<head>
  <style>
    body {
      width: 250px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
    }

    h1 {
      font-size: 18px;
      margin-top: 0;
      margin-bottom: 8px;
      /* Steelman Black */
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    p {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 16px;
    }

    button {
      width: 100%;
      background-color: #0f172a;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: all 0.2s;
    }

    button:hover {
      background-color: #facc15;
      color: #000;
    }

    .secondary {
      background-color: transparent;
      color: #64748b;
      margin-top: 12px;
      font-size: 12px;
      text-decoration: none;
      display: block;
      text-align: center;
      transition: color 0.2s;
    }

    .secondary:hover {
      color: #0f172a;
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <h1>
    <span>Steelman AI</span>
  </h1>
  <p>Analyze the current article to find counter-arguments and fact checks.</p>
  <button id="analyzeBtn">Steelman This Article</button>
  <a href="http://localhost:3000" target="_blank" class="secondary">Open Dashboard</a>
  <script src="popup.js"></script>
</body>

</html>
